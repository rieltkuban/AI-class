# Конфиг ПЕРВОГО запуска: только HTTP, без сертификата.
# Нужен, чтобы nginx поднялся до выпуска сертификата и certbot смог пройти
# проверку домена. После выпуска сертификата заменяется на deploy/nginx.conf.
#
# ЗАМЕНИТЬ example.ru на свой домен.

limit_req_zone $binary_remote_addr zone=run_zone:10m rate=10r/m;
# По умолчанию nginx отдаёт 503, и интерфейс показывает «прогон не запустился».
# 429 — тот же код, что отдаёт приложение, и посетитель видит честное
# «лимит исчерпан, оставьте контакт».
limit_req_status 429;

server {
    listen 80;
    # IPv6. Раскомментируйте, если у сервера есть адрес IPv6.
    # Без него nginx откажется стартовать целиком, поэтому по умолчанию выключено.
    # listen [::]:80;
    server_name example.ru www.example.ru;

    # Сюда certbot кладёт файл проверки домена.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 256k;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Буферизация выключена уже здесь: поток надо проверить сразу,
    # не дожидаясь сертификата.
    location /api/run {
        limit_req zone=run_zone burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        add_header X-Accel-Buffering no always;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
