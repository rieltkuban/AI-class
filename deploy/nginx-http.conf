# Конфиг ПЕРВОГО запуска: только HTTP, без сертификата.
# Нужен, чтобы nginx поднялся до выпуска сертификата и certbot смог пройти
# проверку домена. После выпуска сертификата заменяется на deploy/nginx.conf.
#
# ЗАМЕНИТЬ example.ru на свой домен.
#
# Про повторение proxy_set_header в каждом location — см. deploy/nginx.conf.

limit_req_zone $binary_remote_addr zone=run_zone:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    # IPv6. Раскомментируйте, если у сервера есть адрес IPv6.
    # listen [::]:80;
    server_name example.ru www.example.ru;

    # Сюда certbot кладёт файл проверки домена.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    access_log /var/log/nginx/aiclass.access.log;
    error_log  /var/log/nginx/aiclass.error.log;

    client_max_body_size 256k;

    # ГЛАВНАЯ НАСТРОЙКА ВСЕГО ПРОЕКТА.
    # По умолчанию nginx копит ответ бэкенда в буфер и отдаёт клиенту целиком.
    # Потоковая печать превратится в «страница подумала и выдала текст»,
    # и продающий эффект сайта исчезнет.
    location /api/run {
        limit_req zone=run_zone burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Именно $remote_addr, а НЕ $proxy_add_x_forwarded_for: второй склеивает
        # присланный клиентом заголовок со своим адресом, а приложение берёт
        # из списка ПЕРВЫЙ — то есть подставленный посетителем. Меняя
        # X-Forwarded-For на каждый запрос, он обходит лимит прогонов полностью.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        add_header X-Accel-Buffering no always;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
