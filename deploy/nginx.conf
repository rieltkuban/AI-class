# nginx для сайта-терминала.
# Кладётся в /etc/nginx/sites-available/aiclass, символьная ссылка в sites-enabled.
# ЗАМЕНИТЬ example.ru на свой домен в четырёх местах.

# Второй рубеж перед приложением: ограничение частоты запросов к прогону.
limit_req_zone $binary_remote_addr zone=run_zone:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    # certbot сам добавит сюда редирект на https при выпуске сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.ru www.example.ru;

    # Пути пропишет certbot при выпуске сертификата.
    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;

    access_log /var/log/nginx/aiclass.access.log;
    error_log  /var/log/nginx/aiclass.error.log;

    client_max_body_size 256k;

    # Общие заголовки для всех проксируемых запросов.
    # X-Forwarded-For обязателен: без него приложение увидит 127.0.0.1
    # у всех посетителей и лимит прогонов не сработает ни для кого.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ГЛАВНАЯ НАСТРОЙКА ВСЕГО ПРОЕКТА.
    # По умолчанию nginx копит ответ бэкенда в буфер и отдаёт клиенту целиком.
    # Потоковая печать превратится в «страница подумала и выдала текст»,
    # и продающий эффект сайта исчезнет.
    location /api/run {
        limit_req zone=run_zone burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # На случай, если перед nginx стоит ещё один прокси.
        add_header X-Accel-Buffering no always;
    }

    # Шрифты и статика Next.js — кэшируются надолго, имена содержат хеш.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
